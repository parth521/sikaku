name: Private AI PR Reviewer

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  pr_agent_job:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: Run PR Agent
        uses: the-pr-agent/pr-agent@main
        env:
          OPENAI_KEY: ${{ secrets.OPENAI_KEY }}  # Keep this secret name, but make sure it holds your DeepSeek key
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
          # 🚀 ADD THESE TWO LINES TO ROUTE TO DEEPSEEK:
          OPENAI.BASE_URL: https://api.deepseek.com/v1
          CONFIG.MODEL: deepseek-chat
